spring.config.import=optional:file:./application-local.yml
spring.application.name=kickstarter
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.default-property-inclusion=non_null
app.database.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kickstarter}
app.database.username=${DATABASE_USERNAME:kickstarter}
app.database.password=${DATABASE_PASSWORD}
app.files.directory=${FILES_DIRECTORY:./uploads}
app.demo-payments=${DEMO_PAYMENTS:false}
app.cache.maximum-weight-bytes=${CACHE_MAXIMUM_WEIGHT_BYTES:16777216}
app.cache.ttl-seconds=${CACHE_TTL_SECONDS:15}
logging.level.com.j256.ormlite=WARN
